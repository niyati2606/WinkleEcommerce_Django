{% extends 'header.html' %}
{% load static %}
{% block content %}

<section class="ftco-section" style="min-height: 70vh; display:flex; align-items:center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="cancel-card text-center p-5">

                    <!-- X Icon -->
                    <div class="cancel-circle mb-4">
                        <i class="ion-ios-close"></i>
                    </div>

                    <h2 class="mb-2" style="font-weight:700; color:#e74c3c;">Payment Cancelled</h2>
                    <p class="text-muted mb-1">Your payment was not completed.</p>
                    <p class="text-muted mb-4">Your cart items are still saved. You can try again whenever you're ready.</p>

                    <div class="d-flex justify-content-center flex-wrap" style="gap:12px;">
                        <a href="{% url 'cart' %}" class="btn btn-retry px-4 py-2">
                            <i class="ion-ios-cart mr-1"></i> Return to Cart
                        </a>
                        <a href="{% url 'shop' %}" class="btn btn-outline-secondary px-4 py-2">
                            <i class="ion-ios-storefront mr-1"></i> Continue Shopping
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</section>

<style>
    .cancel-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.09);
    }

    .cancel-circle {
        width: 90px;
        height: 90px;
        background: #fdedec;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        animation: pop 0.4s ease;
    }

    .cancel-circle i {
        font-size: 56px;
        color: #e74c3c;
        line-height: 1;
    }

    @keyframes pop {
        0%   { transform: scale(0.5); opacity: 0; }
        80%  { transform: scale(1.1); }
        100% { transform: scale(1);   opacity: 1; }
    }

    .btn-retry {
        background-color: #f96d00;
        border-color: #f96d00;
        color: #fff !important;
        border-radius: 50px;
        font-weight: 600;
        text-decoration: none;
    }
    .btn-retry:hover {
        background-color: #d95e00;
        border-color: #d95e00;
        text-decoration: none;
    }
</style>

{% endblock %}
