{% extends 'header.html' %}
{% load static %}
{% block content %}

<div class="hero-wrap hero-bread" style="background-image: url(&quot;{% static 'images/bg_6.jpg' %}&quot;);">
    <div class="container">
        <div class="row no-gutters slider-text align-items-center justify-content-center">
            <div class="col-md-9 ftco-animate text-center">
                <p class="breadcrumbs">
                    <span class="mr-2"><a href="/">Home</a></span>
                    <span class="mr-2"><a href="{% url 'login' %}">Login</a></span>
                    <span>Forgot Password</span>
                </p>
                <h1 class="mb-0 bread">Forgot Password</h1>
            </div>
        </div>
    </div>
</div>

<section class="ftco-section contact-section bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">

                {% if error %}
                <div class="alert alert-danger text-center">{{ error }}</div>
                {% endif %}

                <form action="{% url 'forgot_password' %}" method="post" class="bg-white p-5 contact-form">
                    {% csrf_token %}
                    <p class="text-muted mb-4" style="font-size:14px;">
                        Enter your registered email address and we'll verify your account.
                    </p>
                    <div class="form-group">
                        <input type="email" class="form-control" placeholder="Registered Email" name="email" required>
                    </div>
                    <div class="form-group">
                        <input type="submit" value="Send OTP" class="btn btn-primary py-3 px-5">
                    </div>
                    <p class="text-center mt-2">
                        <a href="{% url 'login' %}" style="font-size:13px; color:#f96d00;">
                            <i class="ion-ios-arrow-back mr-1"></i> Back to Login
                        </a>
                    </p>
                </form>

            </div>
        </div>
    </div>
</section>

{% endblock %}
