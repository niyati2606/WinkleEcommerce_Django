{% extends 'header.html' %}
{% load static %}
{% block content %}

<!DOCTYPE html>
<html lang="en">

<head>
  <title>Change Password</title>
</head>

<body class="goto-here">

  <div class="hero-wrap hero-bread" style="background-image: url(&quot;{% static 'images/bg_6.jpg' %}&quot;);">
    <div class="container">
      <div class="row no-gutters slider-text align-items-center justify-content-center">
        <div class="col-md-9 ftco-animate text-center">
          <p class="breadcrumbs"><span class="mr-2"><a href="/">Home</a></span> <span>Change Password</span></p>
          <h1 class="mb-0 bread">Change Password</h1>
        </div>
      </div>
    </div>
  </div>

  <section class="ftco-section contact-section bg-light">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">

          {% if success %}
          <div class="alert alert-success text-center">{{ success }}</div>
          {% endif %}

          {% if error %}
          <div class="alert alert-danger text-center">{{ error }}</div>
          {% endif %}

          <form action="{% url 'change_password' %}" method="post" class="bg-white p-5 contact-form"
                onsubmit="return validateForm()">
            {% csrf_token %}

            <div class="form-group">
              <input type="password" class="form-control" placeholder="Current Password"
                     name="current_password" id="current_password"
                     onblur="validateRequired(this, 'current-error', 'Current password')">
              <div class="invalid-feedback" id="current-error"></div>
            </div>

            <div class="form-group">
              <input type="password" class="form-control" placeholder="New Password"
                     name="new_password" id="new_password"
                     onblur="validateNewPassword(this)">
              <div class="invalid-feedback" id="new-error"></div>
            </div>

            <div class="form-group">
              <input type="password" class="form-control" placeholder="Confirm New Password"
                     name="confirm_password" id="confirm_password"
                     onblur="validateConfirm(this)">
              <div class="invalid-feedback" id="confirm-error"></div>
            </div>

            <div class="form-group">
              <input type="submit" value="Change Password" class="btn btn-primary py-3 px-5">
            </div>

          </form>
        </div>
      </div>
    </div>
  </section>

<script>
  function showError(input, errorId, message) {
    input.classList.add('is-invalid');
    document.getElementById(errorId).textContent = message;
  }

  function clearError(input, errorId) {
    input.classList.remove('is-invalid');
    document.getElementById(errorId).textContent = '';
  }

  function validateRequired(input, errorId, label) {
    if (input.value.trim() === '') {
      showError(input, errorId, label + ' is required.'); return false;
    }
    clearError(input, errorId); return true;
  }

  function validateNewPassword(input) {
    var val = input.value;
    if (val === '') {
      showError(input, 'new-error', 'New password is required.'); return false;
    } else if (val.length < 8) {
      showError(input, 'new-error', 'Password must be at least 8 characters.'); return false;
    } else if (!/[A-Za-z]/.test(val) || !/\d/.test(val)) {
      showError(input, 'new-error', 'Password must contain at least one letter and one number.'); return false;
    }
    clearError(input, 'new-error'); return true;
  }

  function validateConfirm(input) {
    var newPass = document.getElementById('new_password').value;
    if (input.value === '') {
      showError(input, 'confirm-error', 'Please confirm your new password.'); return false;
    } else if (input.value !== newPass) {
      showError(input, 'confirm-error', 'Passwords do not match.'); return false;
    }
    clearError(input, 'confirm-error'); return true;
  }

  function validateForm() {
    var c = validateRequired(document.getElementById('current_password'), 'current-error', 'Current password');
    var n = validateNewPassword(document.getElementById('new_password'));
    var f = validateConfirm(document.getElementById('confirm_password'));
    return c && n && f;
  }
</script>

</body>
</html>
{% endblock %}
