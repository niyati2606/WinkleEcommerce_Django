{% extends 'header.html' %}
{% load static %}
{% block content %}

<div class="hero-wrap hero-bread" style="background-image: url(&quot;{% static 'images/bg_6.jpg' %}&quot;);">
    <div class="container">
        <div class="row no-gutters slider-text align-items-center justify-content-center">
            <div class="col-md-9 ftco-animate text-center">
                <p class="breadcrumbs">
                    <span class="mr-2"><a href="/">Home</a></span>
                    <span class="mr-2"><a href="{% url 'login' %}">Login</a></span>
                    <span>Reset Password</span>
                </p>
                <h1 class="mb-0 bread">Reset Password</h1>
            </div>
        </div>
    </div>
</div>

<section class="ftco-section contact-section bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">

                {% if error %}
                <div class="alert alert-danger text-center">{{ error }}</div>
                {% endif %}

                <form action="{% url 'reset_password' %}" method="post" class="bg-white p-5 contact-form"
                    onsubmit="return validateResetForm()">
                    {% csrf_token %}
                    <p class="text-muted mb-4" style="font-size:14px;">
                        Enter your new password below.
                    </p>

                    <div class="form-group">
                        <input type="password" class="form-control" placeholder="New Password"
                            name="new_password" id="new_password" onblur="validateNew(this)">
                        <div class="invalid-feedback" id="new-password-error"></div>
                    </div>

                    <div class="form-group">
                        <input type="password" class="form-control" placeholder="Confirm New Password"
                            name="confirm_password" id="confirm_password" onblur="validateConfirm(this)">
                        <div class="invalid-feedback" id="confirm-password-error"></div>
                    </div>

                    <div class="form-group">
                        <input type="submit" value="Reset Password" class="btn btn-primary py-3 px-5">
                    </div>
                </form>

            </div>
        </div>
    </div>
</section>

<script>
    function validateNew(input) {
        if (input.value.trim() === '') {
            input.classList.add('is-invalid');
            document.getElementById('new-password-error').textContent = 'Password cannot be empty.';
            return false;
        }
        input.classList.remove('is-invalid');
        document.getElementById('new-password-error').textContent = '';
        return true;
    }

    function validateConfirm(input) {
        var newPwd = document.getElementById('new_password').value;
        if (input.value === '') {
            input.classList.add('is-invalid');
            document.getElementById('confirm-password-error').textContent = 'Please confirm your password.';
            return false;
        }
        if (input.value !== newPwd) {
            input.classList.add('is-invalid');
            document.getElementById('confirm-password-error').textContent = 'Passwords do not match.';
            return false;
        }
        input.classList.remove('is-invalid');
        document.getElementById('confirm-password-error').textContent = '';
        return true;
    }

    function validateResetForm() {
        var a = validateNew(document.getElementById('new_password'));
        var b = validateConfirm(document.getElementById('confirm_password'));
        return a && b;
    }
</script>

{% endblock %}
